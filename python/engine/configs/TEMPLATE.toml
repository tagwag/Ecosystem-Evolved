# ============================================================================================
# EXPERIMENT FORM. Fill it in like a form, then run:  python run.py configs/<your-copy>.toml
# Every setting has a footnote tag like [F7]; look it up in FACTOR_GUIDE.md (same folder) for what it
# means, how it is modelled, the research behind it and the sources.
# Factors: mode = "off" (not in the world) | "auto" (realistic autopilot) | "custom" (your values).
# Some factors have their own mode (e.g. predators chaser/pristionchus): write it as factor_mode = "...".
# To ISOLATE one trait/factor: set that one to custom, leave the rest off (or auto for a natural background).
# ============================================================================================

[run]
name = "unnamed"                              # [R1]
replicates = 30                               # [R2]
ticks = 50000                                 # [R3]
arms = ["frozen", "shadow", "real"]           # [R4]
seed = 1                                      # [R5]
founders = "toybrain_fair"                    # [R6]
every = 500                                   # [R7]
checkpoint_every = 10000                      # [R8]
record_tree = true                            # [R9]

[world]   # the equilibrium world; change only if you know why (Researcher mode in the GUI)
# size = 400.0                                # [W1]
# patches = 80                                # [W2]
# patch_r = 4.0                               # [W3]
# food_max = 20.0                             # [W4]
# regrow = 0.01                               # [W5]
# bite = 0.5                                  # [W6]
# sig_smell = 25.0                            # [W7]
# sig_taste = 5.0                             # [W8]
# e_start = 10.0                              # [W9]
# e_split = 20.0                              # [W10]
# cost_base = 0.02                            # [W11]
# cost_move = 0.02                            # [W12]
# max_age = 6000                              # [W13]
# mut_sigma = 0.1                             # [W14]
# slots = 640                                 # [W15]
# start_fill = 0.25                           # [W16]
# trait_cost = 0.005                          # [W17]
# dauer_cost = 0.002                          # [W18]
# sense_noise = 0.01                          # [W19]
# motor_noise = 0.1                           # [W20]
# mutation_mode = "all"                       # [W21]
# mutation_genes = 10                         # [W22]
# recombination_rate = 0.0                    # [W23]
# recombination_radius = 10.0                 # [W24]
# immigration_rate = 0.0                      # [W25]
# immigrant_source = "founders"               # [W26]

