# ======================================================================= RADIATION (mainly a MUTATION SOURCE)
[radiation]
category = "radiation"
evidence = "EVO"
status = "implemented"
forms = [
  "UV-A (320-400 nm)", "UV-B (280-320 nm)", "UV-C (100-280 nm)",
  "X-ray", "gamma (e.g. Cs-137, Co-60)",
  "alpha particles", "beta particles", "neutrons", "protons",
  "heavy ions / cosmic rays (space)", "radon (alpha emitter, soil gas)",
  "chronic low dose over many generations", "acute high dose", "spatial hotspot (contaminated patch)",
  "solar events (bursts of UV / particles)",
]
model_as = "dose -> extra mutations per genome (gamma ~1 base change per 3 Gy in real worms) + fertility loss at high dose"
notes = "Chornobyl nematodes showed no genome damage signature; DNA-repair genes set sensitivity (2x in repair mutants)."
sources = [15, 16, 17, 18, 19]

[chemical_mutagens]
category = "radiation"
evidence = "EVO"
status = "implemented"
forms = ["EMS (alkylating)", "ENU", "UV-like crosslinkers", "oxidative (reactive oxygen)"]
sources = [20]

