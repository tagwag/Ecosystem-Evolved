# FACTOR CATALOG: every environmental (and population/genetic) factor known to affect C. elegans fitness or evolution,
# with all its forms, as the master list for config-file experiments.
#
# status   implemented = available in the factor engine (python/engine) as off / auto / custom (2026-11-13: all 37).
#          Every implementation is a SIMPLIFIED model of the effect (see python/engine/FACTOR_GUIDE.md).
#          sim_keys = the matching settings in the OLD ecosim (python/ecosim/config.py), kept for reference.
# evidence EVO = shown to drive evolution (experiments or wild populations)   EFFECT = changes fitness/traits/behaviour
#          CONTESTED = disputed in the literature                              UNTESTED = no C. elegans study found
# Sources: see sources.md (numbers in [brackets]). Built 2026-11-13 from a broad literature pass, NOT a systematic review.
# Config files may set any factor here; one that is not implemented must raise "not implemented", never be ignored.

# ======================================================================= PHYSICAL
[temperature]
category = "physical"
evidence = "EVO"
status = "implemented"
sim_keys = ["senses", "temp_bumps", "temp_cost"]      # today: hot/cold spots that cost energy; no effect on development speed
forms = ["constant level", "spatial gradient (thermotaxis)", "daily cycle", "seasonal cycle", "heat shock (short spike)",
         "cold shock", "extreme heat (>25 C sterility in real worms)", "random fluctuation"]
real_range = "lab 15-25 C; fertility collapses above ~25-26 C; dauers survive wider"
notes = "Changes development rate, fertility, lifespan and competition with C. briggsae (warmer favours briggsae)."
sources = [1, 2, 3]

[oxygen]
category = "physical"
evidence = "EVO"
status = "implemented"
forms = ["level (0-21 %)", "gradient", "hypoxia (low)", "anoxia (zero)", "hyperoxia (lab air 21 % vs preferred 5-10 %)",
         "regular normoxia/anoxia cycles", "irregular cycles"]
notes = "npr-1 / glb-5 variants change O2 preference and clumping; regular anoxia cycles evolved maternal glycogen."
sources = [4, 5]

[carbon_dioxide]
category = "physical"
evidence = "EFFECT"
status = "implemented"
forms = ["level", "gradient (rotting fruit / crowded worms make CO2)"]
sources = [4]

[humidity]
category = "physical"
evidence = "EFFECT"
status = "implemented"
forms = ["wet / film of water", "drying out (desiccation)", "full drought (dauer anhydrobiosis)"]
sources = [6]

